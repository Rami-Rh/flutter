name: gestion_stock
description: >-
  Gestion de stock et de ventes pour un petit commerçant.
  100% hors-ligne (SQLite/SQLCipher), bilingue Arabe (RTL) / Français.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # IMPORTANT: intl est verrouillé par flutter_localizations sur la version du SDK.
  intl: any

  # --- Gestion d'état ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Navigation ---
  go_router: ^14.2.7

  # --- Base de données locale (SQLite) ---
  drift: ^2.20.2
  sqlite3: ^2.4.6
  # Bibliothèque native SQLCipher (API compatible SQLite) : permet d'activer le
  # chiffrement de la base via `PRAGMA key` (voir connection/connection.dart).
  sqlcipher_flutter_libs: ^0.6.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Sécurité / Authentification ---
  cryptography: ^2.7.0          # PBKDF2-HMAC-SHA256 (hachage mot de passe / question secrète)
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0            # empreinte / Face ID
  crypto: ^3.0.5

  # --- Caméra / codes-barres ---
  mobile_scanner: ^5.2.3
  barcode: ^2.2.8
  barcode_widget: ^2.0.4

  # --- Impression thermique Bluetooth (ESC/POS 58mm & 80mm) ---
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  image: ^4.1.3                  # trame bitmap du ticket (arabe rendu en image)

  # --- PDF / Rapports / Partage ---
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

  # --- Graphiques (tableau de bord) ---
  fl_chart: ^0.69.0

  # --- Fichiers / Import-Export ---
  file_picker: ^8.1.2
  csv: ^6.0.0
  excel: ^4.0.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.0          # appel direct du fournisseur

  # --- Notifications locales (alertes de stock) ---
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # --- Divers ---
  uuid: ^4.5.0
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ^2.4.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.2
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.6.2
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # Décommente après avoir déposé les polices dans assets/fonts/ :
  # (Cairo & Amiri gèrent l'arabe ; nécessaires aussi pour les rapports PDF)
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf
